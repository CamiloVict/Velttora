# Fly.io — deploy from server/: fly deploy
# https://fly.io/docs/reference/configuration/

app = 'velttora-contact-api'
primary_region = 'gru'

[build]

[env]
  NODE_ENV = 'production'
  LOG_LEVEL = 'info'
  PORT = '8080'
  HOST = '0.0.0.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
